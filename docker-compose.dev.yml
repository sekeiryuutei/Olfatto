networks:
  olfatto_network:
    driver: bridge

volumes:
  postgres_dev_data:
  pgadmin_data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: olfatto_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "5435:5432" # host 5435 (tu elección) -> contenedor 5432 (Postgres real, no cambia)
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - olfatto_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: olfatto_backend_dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: development
      DATABASE_HOST: postgres
    ports:
      - "3100:3000" # host 3100 (tu elección) -> contenedor 3000 (coincide con PORT en .env)
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    command: npm run start:dev
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - olfatto_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: olfatto_frontend_dev
    restart: unless-stopped
    ports:
      - "8100:8100"
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    command: npm run start -- --host 0.0.0.0 --port 8100 --poll 2000
    depends_on:
      - backend
    networks:
      - olfatto_network

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: olfatto_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - olfatto_network
    profiles:
      - tools # optional service (point 54) — start with --profile tools
