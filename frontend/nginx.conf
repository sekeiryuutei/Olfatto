server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Service worker / manifest: never cache, so PWA updates land immediately.
    location ~* (ngsw-worker\.js|ngsw\.json|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* \.(?:css|js|woff2?|ttf|svg|png|jpg|jpeg|webp|avif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Angular SPA fallback — any unmatched path resolves to index.html so
    # client-side routing (e.g. /fragrances/:id) works on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
