gzip on;
gzip_vary on;
gzip_min_length 512;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

server {
    listen 80;
    server_name _;

    # ---- Security headers ----
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ---- API reverse proxy ----
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---- Swagger docs (dev/staging convenience) ----
    location /api/docs {
        proxy_pass http://backend:3000/api/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ---- Static assets cache ----
    location ~* \.(?:css|js|woff2?|ttf|svg|png|jpg|jpeg|webp|avif|ico)$ {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---- Service worker / manifest: never cache ----
    location ~* (service-worker\.js|ngsw-worker\.js|manifest\.webmanifest)$ {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache";
    }

    # ---- Angular app (SPA fallback) ----
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
